x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql://${POSTGRES_USER:-linknote}:${POSTGRES_PASSWORD:-linknote_password}@postgres:5432/${POSTGRES_DB:-linknote}
  REDIS_URL: redis://redis:6379
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (copy .env.example to .env)}
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  LINK_SUGGESTION_THRESHOLD: ${LINK_SUGGESTION_THRESHOLD:-0.30}
  LINK_SUGGESTION_MIN_SHARED_KEYWORDS: ${LINK_SUGGESTION_MIN_SHARED_KEYWORDS:-2}
  LINK_SUGGESTION_MAX_PER_NOTE: ${LINK_SUGGESTION_MAX_PER_NOTE:-10}
  GRAPH_MAX_NODES: ${GRAPH_MAX_NODES:-500}

x-backend-deps: &backend-deps
  migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy

x-worker-health: &worker-health
  # Workers have no HTTP port; they touch HEARTBEAT_FILE every loop. Unhealthy means the loop is stuck or dead.
  test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat) )) -lt 60"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

x-backend-health: &backend-health
  test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  postgres:
    image: postgres:15-alpine
    container_name: linknote-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linknote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linknote_password}
      POSTGRES_DB: ${POSTGRES_DB:-linknote}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linknote} -d ${POSTGRES_DB:-linknote}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: linknote-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  traefik:
    image: traefik:v3.6
    container_name: linknote-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend
      - backend
    profiles:
      - with-proxy

  migrate:
    build:
      context: ./backend
      args:
        SERVICE: auth-service
    container_name: linknote-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  seed:
    build:
      context: ./backend
      args:
        SERVICE: auth-service
    container_name: linknote-seed
    command: ["python", "scripts/seed.py"]
    environment:
      <<: *backend-env
      PYTHONPATH: /app
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@linknote.local}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo123456}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  auth-service:
    build:
      context: ./backend
      args:
        SERVICE: auth-service
    container_name: linknote-auth-service
    environment:
      <<: *backend-env
    depends_on: *backend-deps
    healthcheck: *backend-health
    networks:
      - backend
    ports:
      - "127.0.0.1:8001:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth.service=auth"
      - "traefik.http.services.auth.loadbalancer.server.port=8000"
      # Brute-force protection (FR-3): per client IP, on the credential endpoints only. The longer rule wins
      # routing priority; /me and /logout need a valid session and are called on every page load.
      - "traefik.http.routers.auth-credentials.rule=PathPrefix(`/api/auth/login`) || PathPrefix(`/api/auth/register`) || PathPrefix(`/api/auth/refresh`)"
      - "traefik.http.routers.auth-credentials.service=auth"
      - "traefik.http.routers.auth-credentials.middlewares=auth-ratelimit"
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.burst=10"

  note-service:
    build:
      context: ./backend
      args:
        SERVICE: note-service
    container_name: linknote-note-service
    environment:
      <<: *backend-env
    depends_on: *backend-deps
    healthcheck: *backend-health
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.note.rule=PathPrefix(`/api/notes`) || PathPrefix(`/api/tags`)"
      - "traefik.http.services.note.loadbalancer.server.port=8000"

  outbox-publisher:
    build:
      context: ./backend
      args:
        SERVICE: note-service
    container_name: linknote-outbox-publisher
    command: ["python", "-m", "note_service.publisher"]
    environment:
      <<: *backend-env
      HEARTBEAT_FILE: /tmp/heartbeat
    healthcheck: *worker-health
    depends_on: *backend-deps
    restart: unless-stopped
    networks:
      - backend

  link-service:
    build:
      context: ./backend
      args:
        SERVICE: link-service
    container_name: linknote-link-service
    environment:
      <<: *backend-env
    depends_on: *backend-deps
    healthcheck: *backend-health
    ports:
      - "127.0.0.1:8003:8000"
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.link.rule=PathPrefix(`/api/suggestions`) || PathPrefix(`/api/links`)"
      - "traefik.http.services.link.loadbalancer.server.port=8000"

  link-worker:
    build:
      context: ./backend
      args:
        SERVICE: link-service
    container_name: linknote-link-worker
    command: ["python", "-m", "link_service.worker"]
    environment:
      <<: *backend-env
      HEARTBEAT_FILE: /tmp/heartbeat
    healthcheck: *worker-health
    depends_on: *backend-deps
    restart: unless-stopped
    networks:
      - backend

  graph-service:
    build:
      context: ./backend
      args:
        SERVICE: graph-service
    container_name: linknote-graph-service
    environment:
      <<: *backend-env
    depends_on: *backend-deps
    healthcheck: *backend-health
    ports:
      - "127.0.0.1:8004:8000"
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.graph.rule=PathPrefix(`/api/graph`)"
      - "traefik.http.services.graph.loadbalancer.server.port=8000"

  nginx:
    image: nginx:alpine
    container_name: linknote-nginx
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      note-service:
        condition: service_healthy
      link-service:
        condition: service_healthy
      graph-service:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    container_name: linknote-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      auth-service:
        condition: service_healthy
      note-service:
        condition: service_healthy
      link-service:
        condition: service_healthy
      graph-service:
        condition: service_healthy
    networks:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
