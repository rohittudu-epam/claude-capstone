services:
  postgres:
    image: postgres:15-alpine
    container_name: linknote-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linknote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linknote_password}
      POSTGRES_DB: ${POSTGRES_DB:-linknote}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linknote}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: linknote-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  traefik:
    image: traefik:v2.10
    container_name: linknote-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend
      - backend
    depends_on:
      - postgres
      - redis

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: linknote-auth-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linknote}:${POSTGRES_PASSWORD:-linknote_password}@postgres:5432/${POSTGRES_DB:-linknote}
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8000"

  note-service:
    build:
      context: ./backend/note-service
      dockerfile: Dockerfile
    container_name: linknote-note-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linknote}:${POSTGRES_PASSWORD:-linknote_password}@postgres:5432/${POSTGRES_DB:-linknote}
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:8000
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.note.rule=PathPrefix(`/api/note`)"
      - "traefik.http.services.note.loadbalancer.server.port=8000"

  link-service:
    build:
      context: ./backend/link-service
      dockerfile: Dockerfile
    container_name: linknote-link-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linknote}:${POSTGRES_PASSWORD:-linknote_password}@postgres:5432/${POSTGRES_DB:-linknote}
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:8000
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.link.rule=PathPrefix(`/api/link`)"
      - "traefik.http.services.link.loadbalancer.server.port=8000"

  graph-service:
    build:
      context: ./backend/graph-service
      dockerfile: Dockerfile
    container_name: linknote-graph-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linknote}:${POSTGRES_PASSWORD:-linknote_password}@postgres:5432/${POSTGRES_DB:-linknote}
      AUTH_SERVICE_URL: http://auth-service:8000
    ports:
      - "8004:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.graph.rule=PathPrefix(`/api/graph`)"
      - "traefik.http.services.graph.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: linknote-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - traefik
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  redis_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
