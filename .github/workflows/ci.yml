name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests wipe this database; it is a throwaway service container.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: >-
          mypy shared auth-service/auth_service note-service/note_service
          link-service/link_service graph-service/graph_service
          --ignore-missing-imports --explicit-package-bases
      - name: Tests
        run: pytest --cov=shared --cov=auth_service --cov=note_service --cov=link_service --cov=graph_service --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Detect Next.js app
        id: detect
        run: |
          if [ -d app ] || [ -d src/app ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "20"
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm install
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: npm run lint
      - name: Type check
        if: steps.detect.outputs.present == 'true'
        run: npm run typecheck
      - name: Tests
        if: steps.detect.outputs.present == 'true'
        run: npm test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose config
        run: cp .env.example .env && docker compose config -q
      - name: Build backend images
        run: cp .env.example .env && docker compose build
